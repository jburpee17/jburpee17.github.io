<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geo Compare</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f14;--surface:#131920;--border:#1e2a35;--muted:#3a4f62;--text:#d4e4f0;--subtle:#6e8fa8;--accent-a:#00d4ff;--accent-b:#ff6b35;--accent-c:#7fff6b;--panel-w:360px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;overflow:hidden}
#app{display:flex;height:100vh;width:100vw}
#sidebar{width:var(--panel-w);min-width:var(--panel-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:1000;overflow:hidden;transition:width .25s ease,min-width .25s ease}
#sidebar.collapsed{width:0;min-width:0;border-right:none}
#map-wrap{flex:1;position:relative}
#sidebar-toggle{position:absolute;top:16px;left:-14px;width:28px;height:28px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--subtle);display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;cursor:pointer;z-index:1100;transition:left .25s ease,transform .25s ease,color .2s,border-color .2s;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#sidebar-toggle:hover{color:var(--accent-a);border-color:var(--accent-a)}
#sidebar-toggle.collapsed{transform:rotate(180deg)}
#map{width:100%;height:100%;background:var(--bg);cursor:grab}
#map:active{cursor:grabbing}
#zoom-controls{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;z-index:900;border-radius:6px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#zoom-controls button{width:30px;height:30px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
#zoom-controls button:first-child{border-bottom:none;border-radius:6px 6px 0 0}
#zoom-controls button:last-child{border-radius:0 0 6px 6px}
#zoom-controls button:hover{color:var(--accent-a)}
#header{padding:22px 20px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
#header .wordmark{font-family:"Bebas Neue",sans-serif;font-size:34px;letter-spacing:6px;color:var(--accent-a);line-height:1}
#header .tagline{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--subtle);margin-top:4px}
#search-wrap{padding:12px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
#search-wrap label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--subtle);display:block;margin-bottom:8px}
#search-input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:"DM Sans",sans-serif;font-size:14px;padding:9px 14px;border-radius:6px;outline:none;transition:border-color .2s}
#search-input::placeholder{color:var(--muted)}
#search-input:focus{border-color:var(--accent-a)}
#country-list-wrap{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--muted) transparent}
#country-list{padding:6px 0}
.continent-header{padding:14px 20px 6px;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--accent-a)}
.continent-header:first-child{padding-top:8px}
.country-item{display:flex;align-items:center;gap:10px;padding:8px 20px;cursor:pointer;transition:background .12s;user-select:none}
.country-item:hover{background:rgba(0,212,255,.05)}
.country-item .flag{font-size:18px;line-height:1;width:26px;text-align:center;flex-shrink:0}
.country-item .name{font-size:13px;font-weight:400;flex:1}
.country-item .slot-badge{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0;transition:background .15s,border-color .15s}
.country-item.selected-a .slot-badge{background:var(--accent-a);border-color:var(--accent-a)}
.country-item.selected-b .slot-badge{background:var(--accent-b);border-color:var(--accent-b)}
.country-item.selected-a{background:rgba(0,212,255,.07)}
.country-item.selected-b{background:rgba(255,107,53,.07)}
#selection-bar{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.pill{flex:1;border-radius:6px;padding:8px 10px;font-size:12px;min-height:52px;display:flex;flex-direction:column;justify-content:center;gap:2px;transition:all .2s;cursor:pointer;position:relative;overflow:hidden}
.pill-a{border:1px solid var(--accent-a);background:rgba(0,212,255,.05)}
.pill-b{border:1px solid var(--accent-b);background:rgba(255,107,53,.05)}
.pill .pill-label{font-size:9px;letter-spacing:2px;text-transform:uppercase}
.pill-a .pill-label{color:var(--accent-a)}
.pill-b .pill-label{color:var(--accent-b)}
.pill .pill-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .pill-empty{font-size:12px;color:var(--muted);font-style:italic}
.pill .pill-x{position:absolute;top:6px;right:8px;font-size:14px;color:var(--muted);line-height:1;transition:color .15s}
.pill:hover .pill-x{color:var(--text)}
#map-hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(11,15,20,.85);border:1px solid var(--border);border-radius:8px;padding:7px 16px;font-size:11px;color:var(--subtle);letter-spacing:1px;pointer-events:none;z-index:800;backdrop-filter:blur(8px);white-space:nowrap}
#compare-panel{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:min(680px,calc(100vw - 40px));background:rgba(13,21,30,.96);border:1px solid var(--border);border-radius:12px;backdrop-filter:blur(16px);z-index:900;overflow:hidden;transition:opacity .3s,transform .3s}
#compare-panel.hidden{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(20px)}
.cp-header{display:flex;align-items:stretch;border-bottom:1px solid var(--border)}
.cp-country{flex:1;padding:13px 16px;display:flex;align-items:center;gap:10px}
.cp-country-a{border-right:1px solid var(--border)}
.cp-flag{font-size:22px}
.cp-cname{font-size:14px;font-weight:600}
.cp-iso{font-size:10px;letter-spacing:2px;text-transform:uppercase}
.cp-country-a .cp-iso{color:var(--accent-a)}
.cp-country-b .cp-iso{color:var(--accent-b)}
.cp-vs{padding:0 14px;display:flex;align-items:center;font-family:"Bebas Neue",sans-serif;font-size:18px;letter-spacing:2px;color:var(--muted)}
.cp-stats{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.stat-row{display:flex;flex-direction:column;gap:8px}
.stat-label{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--subtle);font-weight:500}
.stat-bar-wrap{display:flex;align-items:flex-end;gap:8px}
.stat-side{display:flex;flex-direction:column;gap:3px;min-width:108px}
.stat-side-a{align-items:flex-end}
.stat-side-b{align-items:flex-start}
.stat-val{font-family:"DM Mono",monospace;font-size:16px;font-weight:600;letter-spacing:.2px;color:var(--text)}
.stat-ratio-badge{font-family:"DM Mono",monospace;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:10px;white-space:nowrap}
.stat-ratio-badge .arrow{font-size:8px}
.stat-ratio-badge.side-a{color:var(--accent-a);background:rgba(0,212,255,.12)}
.stat-ratio-badge.side-b{color:var(--accent-b);background:rgba(255,107,53,.12)}
.stat-row.single{flex-direction:row;justify-content:space-between;align-items:center;gap:12px}
.stat-row.single .stat-label{flex:1}
.stat-val-single{font-family:"DM Mono",monospace;font-size:17px;font-weight:600;letter-spacing:.2px;color:var(--text)}
.bar-track{flex:1;height:6px;background:var(--border);border-radius:3px;position:relative;display:flex;align-items:center}
.bar-fill-a,.bar-fill-b{position:absolute;height:6px;border-radius:3px;transition:width .6s cubic-bezier(.25,1,.5,1)}
.bar-fill-a{right:50%;background:var(--accent-a);transform-origin:right}
.bar-fill-b{left:50%;background:var(--accent-b);transform-origin:left}
.bar-center{position:absolute;left:50%;transform:translateX(-50%);width:2px;height:12px;background:var(--muted);border-radius:1px;z-index:1}
.cp-loading{padding:26px;text-align:center;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--subtle);display:flex;flex-direction:column;align-items:center;gap:12px}
.spinner{width:26px;height:26px;border:2px solid var(--border);border-top-color:var(--accent-a);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cp-error{padding:20px;color:var(--accent-b);font-size:13px;text-align:center}
.cp-note{font-size:10px;color:var(--muted);text-align:center;padding:8px 16px 12px;letter-spacing:.5px}
.country-path{fill:#1e3a4a;stroke:#2a4a5e;stroke-width:.8px;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .15s,stroke .15s}
.country-path:hover:not(.selected-a):not(.selected-b){fill:#4a9ab5;stroke:#6bc8e0}
.country-path.selected-a{fill:#00d4ff;fill-opacity:.45;stroke:#00d4ff;stroke-width:2px}
.country-path.selected-b{fill:#ff6b35;fill-opacity:.45;stroke:#ff6b35;stroke-width:2px}
.country-label{font-size:9px;font-family:"DM Sans",sans-serif;fill:var(--text);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none;opacity:.85;transition:opacity .15s}
#map.zoom-far .country-label{display:none}
#map.zoom-near .country-label{font-size:12px}
#loader-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;transition:opacity .5s}
#loader-overlay .wordmark{font-family:"Bebas Neue",sans-serif;font-size:54px;letter-spacing:12px;color:var(--accent-a)}
#loader-overlay .sub{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--subtle)}
#loader-overlay .spinner{width:34px;height:34px}
#loader-overlay.done{opacity:0;pointer-events:none}
.no-results{padding:20px;text-align:center;color:var(--muted);font-size:13px;font-style:italic}
</style>
</head>
<body>
<div id="loader-overlay">
  <div class="wordmark">GeoCompare</div>
  <div class="sub">Preparing world data…</div>
  <div class="spinner"></div>
</div>
<div id="app">
  <div id="sidebar">
    <div id="header">
      <div class="wordmark">GeoCompare</div>
      <div class="tagline">Visualize the World</div>
    </div>
    <div id="search-wrap">
      <label>Search Countries</label>
      <input type="text" id="search-input" placeholder="Type a country name…" autocomplete="off"/>
    </div>
    <div id="country-list-wrap">
      <div id="country-list"></div>
    </div>
    <div id="selection-bar">
      <div class="pill pill-a" id="pill-a" onclick="clearSlot('a')">
        <span class="pill-label">Country A</span>
        <span class="pill-empty" id="pill-a-text">Select a country</span>
        <span class="pill-x" id="pill-a-x" style="display:none">✕</span>
      </div>
      <div class="pill pill-b" id="pill-b" onclick="clearSlot('b')">
        <span class="pill-label">Country B</span>
        <span class="pill-empty" id="pill-b-text">Select a country</span>
        <span class="pill-x" id="pill-b-x" style="display:none">✕</span>
      </div>
    </div>
  </div>
  <div id="map-wrap">
    <button id="sidebar-toggle" title="Collapse sidebar" aria-label="Collapse sidebar">‹</button>
    <svg id="map" viewBox="0 0 960 500" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="zoom-controls">
      <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
    </div>
    <div id="map-hint">Click a country on the map or search the sidebar list to select</div>
    <div id="compare-panel" class="hidden">
      <div class="cp-header">
        <div class="cp-country cp-country-a">
          <span class="cp-flag" id="cp-a-flag">🌍</span>
          <div><div class="cp-cname" id="cp-a-name">—</div><div class="cp-iso" id="cp-a-iso">—</div></div>
        </div>
        <div class="cp-vs">VS</div>
        <div class="cp-country cp-country-b">
          <span class="cp-flag" id="cp-b-flag">🌍</span>
          <div><div class="cp-cname" id="cp-b-name">—</div><div class="cp-iso" id="cp-b-iso">—</div></div>
        </div>
      </div>
      <div id="cp-body">
        <div class="cp-loading"><div class="spinner"></div>Fetching data…</div>
      </div>
    </div>
  </div>
</div>

<script src="countries.js"></script>
<script src="world-geo.js"></script>
<script>


// ─────────────────────────────────────────────
//  CONFIG
// ─────────────────────────────────────────────
const INDICATORS = [
  { id:'AG.SRF.TOTL.K2', label:'Area',           fmt:fmtArea,  note:'km² → mi²' },
  { id:'SP.POP.TOTL',    label:'Population',      fmt:fmtPop,   note:''  },
  { id:'NY.GDP.MKTP.CD', label:'GDP (Total)',      fmt:fmtGDP,   note:'current USD' },
  { id:'NY.GDP.PCAP.CD', label:'GDP per Capita',  fmt:fmtUSD,   note:'current USD' },
  { id:'SP.DYN.LE00.IN', label:'Life Expectancy', fmt:fmtLE,    note:'years at birth' },
  
];

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
const S = {
  selectedA: null,
  selectedB: null,
  geoLayers: {},     // iso3 → <path> element
  sortedCountries: [], // sorted by name
};

// ─────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────
function flagEmoji(iso2) {
  if (!iso2 || iso2.length !== 2) return '🌐';
  return [...iso2.toUpperCase()].map(c => String.fromCodePoint(0x1F1E6 + c.charCodeAt(0) - 65)).join('');
}

const CONTINENT_ORDER = ['Africa', 'Asia', 'Europe', 'North America', 'Oceania', 'South America'];

function buildSorted() {
  S.sortedCountries = [...COUNTRY_META].sort((a, b) =>
    CONTINENT_ORDER.indexOf(a.continent) - CONTINENT_ORDER.indexOf(b.continent) ||
    a.eng.localeCompare(b.eng)
  );
}

// ─────────────────────────────────────────────
//  FORMAT FUNCTIONS
// ─────────────────────────────────────────────
function km2toMi2(v) { return v * 0.386102; }

function fmtArea(v) {
  const mi = km2toMi2(v);
  if (mi >= 1e6) return (mi/1e6).toFixed(2)+'M mi²';
  if (mi >= 1e3) return Math.round(mi).toLocaleString()+' mi²';
  return mi.toFixed(0)+' mi²';
}
function fmtPop(v) {
  if (v >= 1e9) return (v/1e9).toFixed(2)+'B';
  if (v >= 1e6) return (v/1e6).toFixed(1)+'M';
  if (v >= 1e3) return (v/1e3).toFixed(0)+'K';
  return v.toLocaleString();
}
function fmtGDP(v) {
  if (v >= 1e12) return '$'+(v/1e12).toFixed(2)+'T';
  if (v >= 1e9)  return '$'+(v/1e9).toFixed(1)+'B';
  if (v >= 1e6)  return '$'+(v/1e6).toFixed(0)+'M';
  return '$'+v.toLocaleString();
}
function fmtUSD(v)  { return '$'+Math.round(v).toLocaleString(); }
function fmtLE(v)   { return v.toFixed(1)+' yrs'; }


// ─────────────────────────────────────────────
//  MAP INIT
// ─────────────────────────────────────────────
const MAP_W = 960, MAP_H = 500;

const svg = d3.select('#map');
const g = svg.append('g');
const projection = d3.geoEqualEarth().fitSize([MAP_W, MAP_H], WORLD_GEO);
const pathGen = d3.geoPath(projection);

const zoomBehavior = d3.zoom()
  .scaleExtent([1, 8])
  .on('zoom', (event) => {
    g.attr('transform', event.transform);
    updateLabelZoom(event.transform.k);
    g.selectAll('text.country-label')
      .attr('transform', d => `translate(${pathGen.centroid(d)}) scale(${1 / event.transform.k})`);
  });

svg.call(zoomBehavior);

function getGeoName(feature) {
  const props = feature.properties;
  return props.NAME_EN || props.ADMIN || '';
}

function getIso3(feature) {
  const p = feature.properties;
  const iso = p.ISO_A3 || p.WB_A3 || '';
  if (iso === '-99') return p.WB_A3 || '';
  return iso;
}

function onCountryClick(event, feature) {
  const iso3 = getIso3(feature);
  const meta = S.sortedCountries.find(c => c.iso3 === iso3)
            || COUNTRY_META.find(c => c.iso3 === iso3);
  if (meta) selectCountry(meta);
  else console.warn('No meta for iso3:', iso3, feature.properties);
}

function restyleSelected() {
  g.selectAll('.country-path').classed('selected-a', false).classed('selected-b', false);
  if (S.selectedA) {
    const el = S.geoLayers[S.selectedA.iso3];
    if (el) el.classList.add('selected-a');
  }
  if (S.selectedB) {
    const el = S.geoLayers[S.selectedB.iso3];
    if (el) el.classList.add('selected-b');
  }
}

function initGeoLayer() {
  g.selectAll('path.country-path')
    .data(WORLD_GEO.features)
    .join('path')
    .attr('class', 'country-path')
    .attr('d', pathGen)
    .each(function(d) {
      const iso3 = getIso3(d);
      if (iso3) S.geoLayers[iso3] = this;
    })
    .on('click', onCountryClick);

  g.selectAll('text.country-label')
    .data(WORLD_GEO.features)
    .join('text')
    .attr('class', 'country-label')
    .attr('transform', d => `translate(${pathGen.centroid(d)})`)
    .text(getGeoName);

  updateLabelZoom(1);
}

function updateLabelZoom(k) {
  const el = document.getElementById('map');
  el.classList.toggle('zoom-far', k < 2);
  el.classList.toggle('zoom-near', k >= 4);
}

function zoomTransformForBounds(bounds, padding) {
  const [[x0, y0], [x1, y1]] = bounds;
  const dx = Math.max(x1 - x0, 1), dy = Math.max(y1 - y0, 1);
  const x = (x0 + x1) / 2, y = (y0 + y1) / 2;
  const scale = Math.max(1, Math.min(8, Math.min((MAP_W - 2 * padding) / dx, (MAP_H - 2 * padding) / dy)));
  return d3.zoomIdentity.translate(MAP_W / 2, MAP_H / 2).scale(scale).translate(-x, -y);
}

function fitToSelection() {
  const feats = [];
  if (S.selectedA) { const el = S.geoLayers[S.selectedA.iso3]; if (el) feats.push(el.__data__); }
  if (S.selectedB) { const el = S.geoLayers[S.selectedB.iso3]; if (el) feats.push(el.__data__); }

  if (!S.selectedA && !S.selectedB) {
    svg.transition().duration(600).call(zoomBehavior.transform, d3.zoomIdentity);
    return;
  }
  if (feats.length === 0) return; // selected countries have no map shape to fit to

  const boundsList = feats.map(f => pathGen.bounds(f));
  const x0 = Math.min(...boundsList.map(b => b[0][0]));
  const y0 = Math.min(...boundsList.map(b => b[0][1]));
  const x1 = Math.max(...boundsList.map(b => b[1][0]));
  const y1 = Math.max(...boundsList.map(b => b[1][1]));

  svg.transition().duration(600).call(zoomBehavior.transform, zoomTransformForBounds([[x0, y0], [x1, y1]], 40));
}

document.getElementById('zoom-in').addEventListener('click', () => {
  svg.transition().duration(300).call(zoomBehavior.scaleBy, 1.5);
});
document.getElementById('zoom-out').addEventListener('click', () => {
  svg.transition().duration(300).call(zoomBehavior.scaleBy, 0.67);
});

// ─────────────────────────────────────────────
//  COUNTRY LIST
// ─────────────────────────────────────────────
function renderList(filter) {
  const list = document.getElementById('country-list');
  const f = (filter || '').toLowerCase().trim();

  const filtered = f
    ? S.sortedCountries.filter(c => c.eng.toLowerCase().includes(f))
    : S.sortedCountries;

  list.innerHTML = '';

  if (filtered.length === 0) {
    list.innerHTML = '<div class="no-results">No countries found</div>';
    return;
  }

  const frag = document.createDocumentFragment();
  let lastContinent = null;
  filtered.slice(0, 300).forEach(c => {
    if (c.continent !== lastContinent) {
      lastContinent = c.continent;
      const header = document.createElement('div');
      header.className = 'continent-header';
      header.textContent = lastContinent;
      frag.appendChild(header);
    }

    const isA = S.selectedA?.iso3 === c.iso3;
    const isB = S.selectedB?.iso3 === c.iso3;

    const div = document.createElement('div');
    div.className = 'country-item' + (isA ? ' selected-a' : isB ? ' selected-b' : '');
    div.innerHTML =
      '<span class="flag">'+flagEmoji(c.iso2)+'</span>' +
      '<span class="name">'+c.eng+'</span>' +
      '<span class="slot-badge"></span>';
    div.addEventListener('click', () => selectCountry(c));
    frag.appendChild(div);
  });
  list.appendChild(frag);
}

document.getElementById('search-input').addEventListener('input', e => {
  renderList(e.target.value);
});

// ─────────────────────────────────────────────
//  SELECTION LOGIC
// ─────────────────────────────────────────────
function selectCountry(c) {
  const isA = S.selectedA?.iso3 === c.iso3;
  const isB = S.selectedB?.iso3 === c.iso3;
  if (isA) { clearSlot('a'); return; }
  if (isB) { clearSlot('b'); return; }

  if (!S.selectedA) S.selectedA = c;
  else if (!S.selectedB) S.selectedB = c;
  else { S.selectedA = S.selectedB; S.selectedB = c; }

  updateUI();
}

function clearSlot(slot) {
  if (slot === 'a') S.selectedA = null;
  else S.selectedB = null;
  updateUI();
}
window.clearSlot = clearSlot;

function updateUI() {
  updatePills();
  renderList(document.getElementById('search-input').value);
  restyleSelected();
  updateComparePanel();
  fitToSelection();
}

function updatePills() {
  const pAText = document.getElementById('pill-a-text');
  const pBText = document.getElementById('pill-b-text');
  const pAX = document.getElementById('pill-a-x');
  const pBX = document.getElementById('pill-b-x');

  if (S.selectedA) {
    pAText.textContent = flagEmoji(S.selectedA.iso2)+' '+S.selectedA.eng;
    pAText.className = 'pill-name';
    pAX.style.display = 'block';
  } else {
    pAText.textContent = 'Select a country';
    pAText.className = 'pill-empty';
    pAX.style.display = 'none';
  }

  if (S.selectedB) {
    pBText.textContent = flagEmoji(S.selectedB.iso2)+' '+S.selectedB.eng;
    pBText.className = 'pill-name';
    pBX.style.display = 'block';
  } else {
    pBText.textContent = 'Select a country';
    pBText.className = 'pill-empty';
    pBX.style.display = 'none';
  }
}

// ─────────────────────────────────────────────
//  WORLD BANK
// ─────────────────────────────────────────────
async function fetchWB(iso2, indicatorId) {
  const url = `https://api.worldbank.org/v2/country/${iso2}/indicator/${indicatorId}?format=json&mrv=5&per_page=5`;
  const res = await fetch(url);
  if (!res.ok) return null;
  const json = await res.json();
  const data = json[1];
  if (!data) return null;
  const entry = data.find(d => d.value !== null);
  return entry ? { value: entry.value, year: entry.date } : null;
}

async function fetchAll(iso2) {
  const results = await Promise.all(
    INDICATORS.map(ind => fetchWB(iso2, ind.id).catch(() => null))
  );
  return Object.fromEntries(INDICATORS.map((ind, i) => [ind.id, results[i]]));
}

// ─────────────────────────────────────────────
//  COMPARE PANEL
// ─────────────────────────────────────────────
function updateComparePanelHeader() {
  const A = S.selectedA, B = S.selectedB;
  const header = document.querySelector('.cp-header');
  const aBlock = document.querySelector('.cp-country-a');
  const bBlock = document.querySelector('.cp-country-b');
  const vs = document.querySelector('.cp-vs');

  aBlock.style.display = A ? 'flex' : 'none';
  bBlock.style.display = B ? 'flex' : 'none';
  vs.style.display = (A && B) ? 'flex' : 'none';
  aBlock.style.borderRight = (A && B) ? '' : 'none';

  if (A) {
    document.getElementById('cp-a-flag').textContent = flagEmoji(A.iso2);
    document.getElementById('cp-a-name').textContent = A.eng;
    document.getElementById('cp-a-iso').textContent  = A.iso2;
  }
  if (B) {
    document.getElementById('cp-b-flag').textContent = flagEmoji(B.iso2);
    document.getElementById('cp-b-name').textContent = B.eng;
    document.getElementById('cp-b-iso').textContent  = B.iso2;
  }
}

let compareTimeout = null;
let lastCompareKey = '';

function updateComparePanel() {
  const panel = document.getElementById('compare-panel');
  if (!S.selectedA && !S.selectedB) { panel.classList.add('hidden'); return; }
  panel.classList.remove('hidden');
  updateComparePanelHeader();

  const key = (S.selectedA?.iso3 || '') + '|' + (S.selectedB?.iso3 || '');
  if (key === lastCompareKey) return; // no reload needed
  lastCompareKey = key;

  document.getElementById('cp-body').innerHTML =
    '<div class="cp-loading"><div class="spinner"></div>Fetching World Bank data…</div>';

  clearTimeout(compareTimeout);
  const A = S.selectedA, B = S.selectedB;
  compareTimeout = setTimeout(() => loadCompareData(A, B, key), 400);
}

async function loadCompareData(A, B, key) {
  try {
    if (A && B) {
      const [dA, dB] = await Promise.all([fetchAll(A.iso2), fetchAll(B.iso2)]);
      if (lastCompareKey !== key) return; // selection changed mid-fetch
      renderCompareStats(dA, dB);
    } else {
      const only = A || B;
      const data = await fetchAll(only.iso2);
      if (lastCompareKey !== key) return; // selection changed mid-fetch
      renderSingleStats(data);
    }
  } catch(e) {
    document.getElementById('cp-body').innerHTML =
      '<div class="cp-error">⚠ Could not load World Bank data.<br>Check your internet connection.</div>';
  }
}

function renderSingleStats(data) {
  const rows = INDICATORS.map(ind => {
    const e = data[ind.id];
    const v = e?.value ?? null;
    const s = v !== null ? ind.fmt(v) : 'N/A';
    const y = e?.year ? ' ('+e.year+')' : '';
    return `<div class="stat-row single">
      <div class="stat-label">
        <span>${ind.label}${ind.note ? ' <span style="opacity:.5;font-size:9px">'+ind.note+'</span>' : ''}</span>
      </div>
      <div class="stat-val-single" title="${s+y}">${s}</div>
    </div>`;
  }).join('');

  document.getElementById('cp-body').innerHTML =
    '<div class="cp-stats">'+rows+'</div>' +
    '<div class="cp-note">Data: World Bank. Values shown are most recent available. Hover values for year.<br>Select a second country to compare.</div>';
}

function renderCompareStats(dA, dB) {
  const rows = INDICATORS.map(ind => {
    const eA = dA[ind.id], eB = dB[ind.id];
    const vA = eA?.value ?? null, vB = eB?.value ?? null;
    const hasA = vA !== null, hasB = vB !== null, both = hasA && hasB;

    let barA = 0, barB = 0, badgeA = '', badgeB = '';
    if (both) {
      const total = vA + vB;
      barA = (vA / total) * 50;
      barB = (vB / total) * 50;
      if (vA !== vB) {
        const bigger = vA > vB ? 'A' : 'B';
        const ratio = (bigger === 'A' ? vA/vB : vB/vA).toFixed(1);
        const badge = '<span class="stat-ratio-badge side-'+bigger.toLowerCase()+'"><span class="arrow">▲</span>'+ratio+'×</span>';
        if (bigger === 'A') badgeA = badge; else badgeB = badge;
      }
    } else {
      if (hasA) barA = 40;
      if (hasB) barB = 40;
    }

    const sA = hasA ? ind.fmt(vA) : 'N/A';
    const sB = hasB ? ind.fmt(vB) : 'N/A';
    const yA = eA?.year ? ' ('+eA.year+')' : '';
    const yB = eB?.year ? ' ('+eB.year+')' : '';

    return `<div class="stat-row">
      <div class="stat-label">
        <span>${ind.label}${ind.note ? ' <span style="opacity:.5;font-size:9px">'+ind.note+'</span>' : ''}</span>
      </div>
      <div class="stat-bar-wrap">
        <div class="stat-side stat-side-a">
          ${badgeA}
          <div class="stat-val" title="${sA+yA}">${sA}</div>
        </div>
        <div class="bar-track">
          <div class="bar-center"></div>
          <div class="bar-fill-a" style="width:0%" data-w="${barA}"></div>
          <div class="bar-fill-b" style="width:0%" data-w="${barB}"></div>
        </div>
        <div class="stat-side stat-side-b">
          ${badgeB}
          <div class="stat-val" title="${sB+yB}">${sB}</div>
        </div>
      </div>
    </div>`;
  }).join('');

  const minYear = [dA,dB].flatMap(d => Object.values(d)).filter(Boolean)
    .map(e => e.year).filter(Boolean).sort()[0];

  document.getElementById('cp-body').innerHTML =
    '<div class="cp-stats">'+rows+'</div>' +
    '<div class="cp-note">Data: World Bank. Values shown are most recent available. Hover values for year.</div>';

  // Animate bars
  requestAnimationFrame(() => {
    document.querySelectorAll('.bar-fill-a,.bar-fill-b').forEach(el => {
      requestAnimationFrame(() => { el.style.width = el.dataset.w + '%'; });
    });
  });
}

// ─────────────────────────────────────────────
//  SIDEBAR COLLAPSE
// ─────────────────────────────────────────────
const sidebarEl = document.getElementById('sidebar');
const sidebarToggle = document.getElementById('sidebar-toggle');

sidebarToggle.addEventListener('click', () => {
  const collapsed = sidebarEl.classList.toggle('collapsed');
  sidebarToggle.classList.toggle('collapsed', collapsed);
  sidebarToggle.title = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
  sidebarToggle.setAttribute('aria-label', sidebarToggle.title);
});

// ─────────────────────────────────────────────
//  BOOT
// ─────────────────────────────────────────────
function boot() {
  buildSorted();
  initGeoLayer();
  renderList();
  const overlay = document.getElementById('loader-overlay');
  setTimeout(() => {
    overlay.classList.add('done');
    setTimeout(() => overlay.remove(), 500);
  }, 600);
}

boot();
</script>
